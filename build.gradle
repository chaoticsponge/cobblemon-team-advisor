plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'local.cobblemonteamadvisor'
version = '1.12.0'

base {
    archivesName = 'cobblemon-team-advisor'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.248'
}

dependencies {
    compileOnly files('../mods/Cobblemon-neoforge-1.7.3+1.21.1.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.register('battlePolicyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.cobblemonteamadvisor.BattleMatchupPolicyTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('check') {
    dependsOn battlePolicyTest
}
